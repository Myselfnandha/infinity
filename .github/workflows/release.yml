# This workflow is optimized for blazing-fast parallel matrix compilation and auto-uploading release APKs to GitHub Releases
name: Fast Release APK Build & Publish

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0, v0.1.0)
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      is_draft:
        description: 'Create as Draft Release'
        required: false
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # Required for publishing releases and uploading binary assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: Fast Parallel Code Verification (Analysis & Unit Tests)
  # =========================================================================
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # This step checks out the code with shallow depth for maximum speed
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # This step sets up the Flutter environment with caching
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # This step caches pub packages to avoid redundant network downloads
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # This step resolves dependencies quickly
      - name: Install dependencies
        run: flutter pub get

      # This step executes static analysis
      - name: Run Flutter analyze
        run: flutter analyze

      # This step executes unit and widget test suite
      - name: Run Flutter tests
        run: flutter test

  # =========================================================================
  # JOB 2: Blazing-Fast Parallel Matrix APK Compilation
  # Compiles arm64-v8a and universal APKs on separate VMs simultaneously
  # =========================================================================
  build-apk-matrix:
    name: Build ${{ matrix.name }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Matrix runner 1: ARM64-v8a (target modern physical phones)
          - name: arm64-v8a
            target: android-arm64
            output_name: infinity-arm64-v8a-release.apk
          # Matrix runner 2: x86_64 (dedicated for PC Android emulators)
          - name: x86_64
            target: android-x64
            output_name: infinity-x86_64-release.apk
          # Matrix runner 3: Universal (covers all architectures: arm, arm64, x64)
          - name: universal
            target: android-arm,android-arm64,android-x64
            output_name: infinity-universal-release.apk

    steps:
      # This step checks out the repository with shallow depth for speed
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # This step installs Java 17 Temurin JDK
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This step configures Gradle build cache for rapid builds
      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # This step sets up Flutter SDK with runner caching
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # This step caches pub packages
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # This step resolves dependencies
      - name: Install dependencies
        run: flutter pub get

      # This step compiles targeted release APK bypassing unnecessary dependency validation
      - name: Compile ${{ matrix.name }} APK
        run: |
          flutter build apk --release \
            --target-platform ${{ matrix.target }} \
            --no-tree-shake-icons \
            --android-skip-build-dependency-validation

      # This step renames the compiled binary to the designated output name
      - name: Prepare APK binary
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/${{ matrix.output_name }}
          ls -lh release-artifacts/

      # This step uploads the APK artifact with 0 re-compression overhead
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: release-artifacts/${{ matrix.output_name }}
          retention-days: 1
          compression-level: 0

  # =========================================================================
  # JOB 3: Auto-Upload and Publish to GitHub Releases
  # =========================================================================
  publish-release:
    name: Auto-Upload to GitHub Release
    needs: [quality-check, build-apk-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # This step determines the effective release tag
      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0-${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      # This step downloads all compiled APK artifacts from all parallel matrix runners
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: release-artifacts
          merge-multiple: true

      # This step automatically creates the GitHub Release and attaches the APKs
      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Infinity Release ${{ steps.release_info.outputs.tag }}
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
