# This configuration optimizes JVM memory and garbage collection for build speed and CI stability
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC
# This setting enables parallel project execution in Gradle
org.gradle.parallel=true
# This setting enables the Gradle local and remote build cache
org.gradle.caching=true
# This setting disables file system watching on CI runners to reduce background IO overhead
org.gradle.vfs.watch=false
# This setting optimizes R8 dex compilation speed
android.enableR8.fullMode=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
