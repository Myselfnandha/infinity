# This configuration optimizes JVM memory and garbage collection for build speed and CI stability
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# This setting enables parallel project execution in Gradle
org.gradle.parallel=true
# This setting enables the Gradle local and remote build cache
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
